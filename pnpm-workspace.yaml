packages:
  - "apps/*"
  - "!apps/dev"
  - "packages/*"

allowBuilds:
  "@swc/core": true
  esbuild: true

minimumReleaseAge: 10080
minimumReleaseAgeExclude:
  - tmp
  - "@cloudoperators/juno-ui-components"
  - "@fastify/static@10.1.2"
  - "source-map-js@1.2.2"
  - "shell-quote@1.11.0"

overrides:
  "@fastify/static@<10.1.2": ^10.1.2
  "tmp@<0.2.6": ">=0.2.6"
  "js-yaml@>=3.0.0 <3.15.2": "3.15.2"
  "js-yaml@>=4.0.0 <4.3.2": "4.3.2"
  "esbuild@>=0.27.3 <0.28.1": ">=0.28.1"
  "fast-uri@>=3.0.0 <3.1.7": "^3.1.7"
  "fast-uri@>=4.0.0 <4.1.4": "^4.1.4"
  "undici@>=8.1.0 <8.10.2": "^8.10.2"
  "seroval@<1.6.3": "1.6.3"
  "seroval-plugins@<1.6.3": "1.6.3"
  "source-map-js@<1.2.2": "1.2.2"
  "fastify@<5.12.5": "5.12.5"
  "@fastify/busboy@<3.2.2": "3.2.2"
  "brace-expansion@<1.1.21": "1.1.21"
