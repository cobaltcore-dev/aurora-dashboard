name: CI Check Title
on:
  pull_request:
    types: [opened, edited, synchronize, reopened]
permissions:
  pull-requests: read
jobs:
  title-lint:
    name: Validate PR title
    runs-on: ubuntu-latest
    steps:
      - name: Checkout base branch (trusted config)
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          ref: ${{ github.event.pull_request.base.sha }}

      - name: Validate PR title
        env:
          PR_TITLE: ${{ github.event.pull_request.title }}
        run: |
          node -e "
            import('./commitlint.config.mjs').then(({ types, scopes }) => {
              const title = process.env.PR_TITLE || '';
              const m = title.match(/^(\w+)\(([\w\$.\-*/ ,]+)\)!?: (.+)$/);

              if (!m) throw 'Format muss sein: type(scope): subject';

              const [, type, scopeStr, subject] = m;

              if (!types.includes(type))
                throw 'Unbekannter type \"' + type + '\". Erlaubt: ' + types.join(', ');

              for (const s of scopeStr.split(',').map(x => x.trim())) {
                if (/^(release|[A-Z]+)$/.test(s)) throw 'Scope \"' + s + '\" ist nicht erlaubt';
                if (!scopes.includes(s)) throw 'Unbekannter scope \"' + s + '\". Erlaubt: ' + scopes.join(', ');
              }

              if (/^[A-Z]/.test(subject)) throw 'Subject darf nicht mit Großbuchstaben beginnen';

              console.log('✅ Titel ok: ' + title);
            }).catch(e => { console.error('❌ ' + e); process.exit(1); });
          "
